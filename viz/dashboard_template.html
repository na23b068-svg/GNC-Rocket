<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNC Dashboard</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace;
}

:root[data-theme="dark"], :root[data-theme="light"], :root {
  color-scheme: dark;
  --bg: #000000;
  --panel: #000000;
  --panel2: #111111;
  --panel3: #1a1a1a;
  --border: #222222;
  --grid: #161616;
  --ground: #0a0a0a;
  --text: #ffffff;
  --text2: #d4d4d4;
  --muted: #888888;
  
  /* Pure monochrome UI - NO GLOWS, NO HALOS, ZERO BLUR */
  --accent: #ffffff;
  --accent-hover: #e5e5e5;
  --accent-ink: #000000;
  --rocket: #ffffff;
  
  /* Colors ONLY for data traces and graph curves */
  --s1: #38bdf8;
  --s2: #f59e0b;
  --s3: #10b981;
  --s4: #ef4444;
  --s5: #a855f7;
  --s6: #06b6d4;
  --s7: #ec4899;
  --s8: #eab308;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  background: #000000 !important;
  color: #ffffff !important;
  font: 14px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

#app {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  min-height: 100vh;
  background: #000000;
}

/* Sidebar */
aside {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  background: #000000;
  border-right: 1px solid #222222;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.brand {
  padding: 0 4px 12px;
  border-bottom: 1px solid #222222;
}
.brand b {
  display: block;
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.01em;
}
.brand small {
  color: #888888;
  font-size: 11.5px;
  display: block;
  margin-top: 2px;
}

#demo-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}

.group-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #888888;
  margin: 14px 6px 4px;
  font-weight: 700;
}

.demo-btn {
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
  color: #cccccc;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
}

.demo-btn:hover {
  background: #111111;
  color: #ffffff;
  border-color: #262626;
}

.demo-btn.on {
  background: #181818;
  color: #ffffff;
  border-color: #555555;
  font-weight: 600;
}

.demo-btn .tag {
  font-size: 10px;
  color: #888888;
  font-weight: 500;
  background: #000000;
  border: 1px solid #222222;
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
  font-family: var(--mono);
}

.demo-btn.on .tag {
  color: #ffffff;
  border-color: #555555;
}

.side-foot {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 4px 0;
  border-top: 1px solid #222222;
  color: #888888;
  font-size: 11px;
}

.btn {
  background: #111111;
  border: 1px solid #333333;
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: 500;
  color: #ffffff;
  font-size: 12px;
}
.btn:hover {
  background: #222222;
  border-color: #666666;
}

/* Main Content Area */
main {
  padding: 24px 32px 56px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
  max-width: 1680px;
  background: #000000;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
}

#demo-group {
  color: #888888;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  margin-bottom: 3px;
}

h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.015em;
  line-height: 1.25;
}

/* Human-oriented readable text measure (65-72 characters max-width) */
.desc {
  max-width: 70ch;
  color: #d4d4d4;
  font-size: 14.5px;
  line-height: 1.65;
}
.desc p {
  margin: 0 0 10px;
}

.seg {
  display: inline-flex;
  background: #111111;
  border: 1px solid #333333;
  border-radius: 4px;
  padding: 2px;
  gap: 2px;
}
.seg button {
  border: 0;
  background: transparent;
  color: #888888;
  padding: 5px 12px;
  border-radius: 3px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
}
.seg button:hover:not(:disabled) {
  color: #ffffff;
}
.seg button.on {
  background: #ffffff;
  color: #000000;
  font-weight: 700;
}
.seg button:disabled { opacity: .3; cursor: not-allowed; }
.seg.big button { padding: 6px 18px; font-size: 13px; }

.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tab {
  background: #000000;
  border: 1px solid #222222;
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
  color: #888888;
  font-weight: 500;
  font-size: 12.5px;
}
.tab:hover {
  color: #ffffff;
  border-color: #444444;
  background: #111111;
}
.tab.on {
  background: #181818;
  color: #ffffff;
  border-color: #ffffff;
  font-weight: 600;
}

.card {
  background: #000000;
  border: 1px solid #222222;
  border-radius: 6px;
}

#main-view {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #000000;
}

.view-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  color: #888888;
  font-size: 12px;
}
.view-bar label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

select {
  background: #111111;
  color: #ffffff;
  border: 1px solid #333333;
  border-radius: 4px;
  padding: 4px 8px;
  font: inherit;
  font-size: 12px;
  outline: none;
}

#view2d {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr));
  gap: 8px;
  align-items: start;
}
#view2d .view-plot { height: 480px; min-width: 0; background: #000000; border: 1px solid #1a1a1a; border-radius: 4px; }
#scene-plot { height: 600px; background: #000000; border: 1px solid #1a1a1a; border-radius: 4px; }

.time-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 4px 2px;
  border-top: 1px solid #1a1a1a;
}

#play-btn {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  border: 1px solid #444444;
  background: #141414;
  color: #ffffff;
  cursor: pointer;
  font-size: 13px;
  display: grid;
  place-items: center;
  flex: none;
}
#play-btn:hover {
  background: #222222;
  border-color: #ffffff;
}

#time-slider {
  flex: 1;
  min-width: 160px;
  height: 4px;
  background: #222222;
  accent-color: #ffffff;
  outline: none;
}

#time-label {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: #ffffff;
  min-width: 150px;
  text-align: right;
  white-space: nowrap;
}

.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip {
  background: #0e0e0e;
  border: 1px solid #222222;
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  color: #888888;
  white-space: nowrap;
}
.chip:hover {
  border-color: #555555;
  color: #ffffff;
  background: #161616;
}
.chip b {
  font-family: var(--mono);
  font-weight: 600;
  color: #555555;
  margin-right: 4px;
}
.chip.past {
  border-color: #666666;
  background: #1a1a1a;
  color: #ffffff;
}
.chip.past b {
  color: #ffffff;
}

/* Metric KPI Cards - Human readable sizing */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
}
.metric {
  padding: 12px 14px;
  background: #080808;
  border: 1px solid #1c1c1c;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 72px;
}
.metric.metric-text {
  grid-column: span 2;
  background: #0b0b0b;
}
@media (max-width: 768px) {
  .metric.metric-text {
    grid-column: span 1;
  }
}
.metric .k {
  color: #888888;
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.35;
  margin-bottom: 6px;
}
.metric .v {
  font-size: 22px;
  font-weight: 700;
  font-family: var(--mono);
  color: #ffffff;
  line-height: 1.2;
}
.metric .v.multi-val {
  font-size: 16px;
  letter-spacing: -0.01em;
}
.metric .v.text-val {
  font-family: var(--font);
  font-size: 13.5px;
  font-weight: 500;
  color: #e5e5e5;
  line-height: 1.5;
  word-break: normal;
}
.metric .u {
  font-size: 12px;
  color: #888888;
  font-weight: 400;
  margin-left: 5px;
  font-family: var(--font);
}

.plot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
  gap: 10px;
}
.plot-card {
  padding: 12px 14px 6px;
  min-width: 0;
  background: #000000;
  border: 1px solid #1a1a1a;
  border-radius: 6px;
}
.plot-card h3, .section-title {
  margin: 0 0 8px;
  font-size: 13.5px;
  font-weight: 600;
  color: #ffffff;
  letter-spacing: -0.01em;
}
.plot { height: 300px; background: #000000; }

.table-card {
  padding: 16px 20px;
  overflow-x: auto;
  background: #080808;
  border: 1px solid #1a1a1a;
  border-radius: 6px;
  width: fit-content;
  max-width: 100%;
}
table {
  border-collapse: collapse;
  width: auto;
  font-size: 12.5px;
  margin-top: 8px;
}
th, td {
  padding: 7px 14px;
  border-bottom: 1px solid #171717;
  text-align: left;
  white-space: nowrap;
}
th {
  background: #0e0e0e;
  color: #888888;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.04em;
  border-bottom: 1px solid #262626;
}
tr:hover td {
  background: #121212;
}
td {
  color: #d4d4d4;
}
td.num {
  text-align: right;
  font-family: var(--mono);
  font-size: 12px;
  color: #ffffff;
  font-variant-numeric: tabular-nums;
}
td.pass {
  font-weight: 600;
  color: #ffffff;
}
td.fail {
  font-weight: 600;
  color: #666666;
}

/* Human-oriented text cards for notes & analysis (comfortable 75ch measure) */
.text-card {
  padding: 20px 24px;
  color: #d4d4d4;
  font-size: 14px;
  line-height: 1.65;
  background: #080808;
  border: 1px solid #1a1a1a;
  border-radius: 6px;
  max-width: 820px;
}
.text-card .section-title {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #888888;
}
.notes-body p {
  margin: 0 0 10px;
}
.notes-body p:last-child {
  margin-bottom: 0;
}

.empty {
  color: #666666;
  padding: 24px;
  text-align: center;
  font-size: 13px;
}

kbd {
  font-family: var(--mono);
  font-size: 10.5px;
  background: #141414;
  border: 1px solid #333333;
  border-radius: 3px;
  padding: 1px 4px;
  color: #cccccc;
}

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid #222222; }
  main { padding: 14px; }
  #view2d .view-plot { height: 360px; }
  #scene-plot { height: 460px; }
}
</style>
<script>/*__PLOTLY_JS__*/</script>

<body>
<div id="app">
  <aside>
    <div class="brand">
  <b>GNC DASHBOARD</b>
  <small>Sounding Rocket 6-DOF &middot; Midland, TX</small>
</div>
    <nav id="demo-list" aria-label="Demos"></nav>
    <div class="side-foot">
      
      <div><kbd>Space</kbd> play/pause &nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd> step (<kbd>Shift</kbd> &times;10)</div>
      <div id="build-info"></div>
    </div>
  </aside>
  <main>
    <header>
      <div><div id="demo-group"></div><h1 id="demo-title"></h1></div>
      <div class="seg big" id="view-toggle" role="group" aria-label="View">
        <button type="button" data-view="2d">2D</button><button type="button" data-view="3d">3D</button>
      </div>
    </header>
    <div class="desc" id="demo-desc"></div>
    <div class="tabs" id="variant-tabs" role="tablist"></div>
    <section class="card" id="main-view">
      <div class="view-bar">
        <span id="view-hint"></span>
        <div class="seg" id="scale-toggle" role="group" aria-label="3D scale">
          <button type="button" data-scale="true">True scale</button><button type="button" data-scale="stretched">Stretched</button>
        </div>
      </div>
      <div id="view2d"></div>
      <div id="view3d" hidden><div id="scene-plot"></div></div>
      <div class="time-row">
        <button id="play-btn" type="button" aria-label="Play">&#9654;</button>
        <input id="time-slider" type="range" min="0" max="0" step="1" value="0" aria-label="Time">
        <span id="time-label"></span>
        <div class="seg" id="speed-seg" role="group" aria-label="Playback speed"></div>
      </div>
      <div class="chips" id="event-chips"></div>
    </section>
    <section class="metric-grid" id="metrics"></section>
    <section class="plot-grid" id="plots"></section>
    <section id="tables" style="display:flex;flex-direction:column;gap:12px"></section>
    <section id="notes"></section>
    <section id="analysis-events"></section>
  </main>
</div>
<script id="gnc-data" type="application/json">__GNC_DATA__</script>
<script>
(function () {
'use strict';
const DATA = JSON.parse(document.getElementById('gnc-data').textContent);
const DEMOS = DATA.demos;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const SPEEDS = [0.5, 1, 2, 5, 10, 50, 200];
const TRAIL_S = 8;  // seconds of fading trail in 3D
const S = { d: 0, v: 0, view: '2d', i: 0, simT: 0, playing: false, speed: 1, scale: 'true',
            lastWall: null, lastCursor: 0, stale2d: true, stale3d: true, theme: 'dark' };
let C = null;          // context of the current variant
let PLOTS = [];        // [{div, time}]
let DYN2 = null, DYN3 = null, G3 = null;
const CFG = { displaylogo: false, responsive: true, modeBarButtonsToRemove: ['lasso2d', 'select2d'] };

try { const th = localStorage.getItem('gnc-theme'); if (th === 'light' || th === 'dark') S.theme = th; } catch (e) {}
document.documentElement.dataset.theme = S.theme;

// ------------------------------------------------------------------ helpers
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function theme() {
  const s = []; for (let k = 1; k <= 8; k++) s.push(cssv('--s' + k));
  return { bg: cssv('--panel'), text: cssv('--text'), text2: cssv('--text2'), muted: cssv('--muted'), grid: cssv('--grid'),
           border: cssv('--border'), ground: cssv('--ground'), rocket: cssv('--rocket'), s };
}
const ok = p => Array.isArray(p) && p[0] != null && p[1] != null && p[2] != null;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function fmt(v) {
  if (v == null) return '—';
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (typeof v !== 'number') return String(v);
  if (!isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e9 || a < 1e-3)) return v.toExponential(3);
  if (Number.isInteger(v)) return v.toLocaleString('en-US');
  return parseFloat(v.toPrecision(4)).toLocaleString('en-US', { maximumFractionDigits: 6 });
}
function axis(th, title, extra) {
  return Object.assign({ title: { text: title || '', font: { size: 12, color: th.text2 } }, gridcolor: th.grid, zerolinecolor: th.border,
    linecolor: th.border, tickfont: { size: 11, color: th.muted }, automargin: true }, extra || {});
}
function baseLayout(th, uirev) {
  return { paper_bgcolor: th.bg, plot_bgcolor: th.bg, uirevision: uirev,
    font: { family: cssv('--font'), size: 12, color: th.text2 },
    margin: { l: 56, r: 16, t: 34, b: 44 }, hovermode: 'closest',
    hoverlabel: { font: { family: cssv('--font') } },
    legend: { orientation: 'h', x: 0, y: 1.0, xanchor: 'left', yanchor: 'bottom', bgcolor: 'rgba(0,0,0,0)', font: { size: 11, color: th.text2 } },
    modebar: { bgcolor: 'rgba(0,0,0,0)', color: th.muted, activecolor: th.text } };
}
function idxAt(T) {   // nearest sample index to time T
  const t = C.t; let lo = 0, hi = t.length - 1;
  if (T <= t[0]) return 0; if (T >= t[hi]) return hi;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (t[m] <= T) lo = m; else hi = m; }
  return (T - t[lo] < t[hi] - T) ? lo : hi;
}
function floorIdx(T) { const i = idxAt(T); return (C.t[i] > T && i > 0) ? i - 1 : i; }
function quatR(q) {   // scalar-first, body -> ENU
  const n = Math.hypot(q[0], q[1], q[2], q[3]) || 1, w = q[0] / n, x = q[1] / n, y = q[2] / n, z = q[3] / n;
  return [[1 - 2 * (y * y + z * z), 2 * (x * y - w * z), 2 * (x * z + w * y)],
          [2 * (x * y + w * z), 1 - 2 * (x * x + z * z), 2 * (y * z - w * x)],
          [2 * (x * z - w * y), 2 * (y * z + w * x), 1 - 2 * (x * x + y * y)]];
}
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit = a => { const n = Math.hypot(a[0], a[1], a[2]); return n > 1e-12 ? [a[0] / n, a[1] / n, a[2] / n] : null; };
function bodyAxes(i) {   // [nose, body-y] in ENU; falls back to velocity direction without quat
  const q = C.quat && C.quat[i];
  if (q && q.every(v => v != null)) { const R = quatR(q); return [[R[0][0], R[1][0], R[2][0]], [R[0][1], R[1][1], R[2][1]]]; }
  const a = C.pos[Math.max(0, i - 1)], b = C.pos[Math.min(C.N - 1, i + 1)];
  const nose = (ok(a) && ok(b) && unit([b[0] - a[0], b[1] - a[1], b[2] - a[2]])) || [0, 0, 1];
  return [nose, unit(cross([0, 0, 1], nose)) || [0, 1, 0]];
}

// ------------------------------------------------------------------ context
function makeCtx(demo, v) {
  const r = v.rocket;
  const c = { demo, v, t: v.t || [], rocket: (r && r.pos && r.pos.length) ? r : null, events: v.events || [] };
  if (!c.rocket) return c;
  c.N = c.t.length; c.pos = r.pos; c.quat = r.quat || null; c.est = r.pos_est || null;
  c.objects = v.objects || [];
  const sc = v.scene || {};
  c.sc = { frame: sc.frame || 'ENU', labels: sc.axis_labels || ['East [m]', 'North [m]', 'Up [m]'], ground: sc.ground != null ? sc.ground : sc.frame !== 'LVLH',
           glyph: sc.glyph || 'rocket', glyphLen: sc.glyph_length_m || null,
           views: sc.views2d || [{ title: 'Side view', x: 'downrange', y: 2 }, { title: 'Ground track', x: 0, y: 1 }] };
  let best = 0, dir = [1, 0];
  for (const p of c.pos) { if (!ok(p)) continue; const h = Math.hypot(p[0], p[1]); if (h > best) { best = h; dir = [p[0] / h, p[1] / h]; } }
  if (best < 1) dir = [1, 0];

    scene: { aspectmode: 'manual', aspectratio: { x: G3.a[0], y: G3.a[1], z: G3.a[2] }, xaxis: sa(lb[0], 0), yaxis: sa(lb[1], 1), zaxis: sa(lb[2], 2),
             camera: { eye: camEye(), up: { x: 0, y: 0, z: 1 } }, bgcolor: th.bg, uirevision: 'scene' + c.demo.id + S.scale } });
  Plotly.react('scene-plot', tr, layout, CFG);
  hookClick('scene-plot');
  S.stale3d = false;
}
function update3D() {
  const r = DYN3.map(d => d.fn(S.i));
  Plotly.restyle('scene-plot', { x: r.map(a => a[0]), y: r.map(a => a[1]), z: r.map(a => a[2]) }, DYN3.map(d => d.k));
}

function hookClick(id) {
  const div = $(id);
  if (div._gncHooked) return; div._gncHooked = true;
  div.on('plotly_click', ev => {
    const pt = ev && ev.points && ev.points[0];
    if (C && C.rocket && pt && typeof pt.customdata === 'number') seek(pt.customdata);
  });
}

// ------------------------------------------------------------------ time
function seek(T) { S.i = idxAt(T); S.simT = C.t[S.i]; updateTime(true); }
function setIdx(i) { S.i = clamp(i, 0, C.N - 1); S.simT = C.t[S.i]; updateTime(true); }
function updateTime(force) {
  if (!C || !C.rocket) return;
  const t = C.t[S.i], tEnd = C.t[C.N - 1];
  $('time-slider').value = S.i;
  $('time-label').textContent = `t = ${t.toFixed(2)} s / ${tEnd.toFixed(1)} s`;
  if (S.view === '2d' && !S.stale2d) update2D();
  if (S.view === '3d' && !S.stale3d) update3D();
  document.querySelectorAll('#event-chips .chip').forEach(ch => ch.classList.toggle('past', +ch.dataset.t <= t + 1e-9));
  const now = performance.now();
  if (force || !S.playing || now - S.lastCursor > 90) {   // cursor relayouts are the costly part; throttle while playing
    S.lastCursor = now;
    PLOTS.forEach(p => { if (p.time) Plotly.relayout(p.div, { 'shapes[0].x0': t, 'shapes[0].x1': t }); });
  }
}
function tick(ts) {
  if (!S.playing) return;
  if (S.lastWall == null) S.lastWall = ts;
  S.simT += (ts - S.lastWall) / 1000 * S.speed; S.lastWall = ts;
  const tEnd = C.t[C.N - 1];
  if (S.simT >= tEnd) { S.i = C.N - 1; updateTime(true); pause(); return; }
  S.i = floorIdx(S.simT); updateTime(false);
  requestAnimationFrame(tick);
}
function play() {
  if (!C || !C.rocket || C.N < 2) return;
  if (S.i >= C.N - 1) { S.i = 0; S.simT = C.t[0]; }
  S.playing = true; S.lastWall = null; $('play-btn').innerHTML = '&#10074;&#10074;'; $('play-btn').setAttribute('aria-label', 'Pause');
  requestAnimationFrame(tick);
}
function pause() { S.playing = false; $('play-btn').innerHTML = '&#9654;'; $('play-btn').setAttribute('aria-label', 'Play'); updateTime(true); }
const togglePlay = () => S.playing ? pause() : play();

// ------------------------------------------------------------------ view switching
function setView(v) {
  if (!C || !C.rocket) return;
  S.view = v;
  document.querySelectorAll('#view-toggle button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $('view2d').hidden = v !== '2d'; $('view3d').hidden = v !== '3d';
  $('scale-toggle').hidden = v !== '3d';
  $('view-hint').textContent = v === '2d' ? 'Projections of the trajectory · click a trajectory to jump to that time'
                                          : `Drag to orbit, scroll to zoom · ${glyphName().toLowerCase()} glyph oriented by the attitude quaternion`;
  if (v === '2d') { if (S.stale2d) build2D(); else DYN2.forEach(d => Plotly.Plots.resize(d.div)); }
  else { if (S.stale3d) build3D(); else Plotly.Plots.resize('scene-plot'); }
  updateTime(true);
}

// ------------------------------------------------------------------ panels
function paragraphs(text) {
  const f = document.createDocumentFragment();
  String(text || '').split(/\n\s*\n/).filter(s => s.trim()).forEach(s => f.append(el('p', null, s.trim())));
  return f;
}
function buildMetrics(v) {
  const box = $('metrics'); box.innerHTML = '';
  Object.entries(v.metrics || {}).forEach(([k, val]) => {
    const m = /^(.*?)\s*\[([^\]]+)\]\s*$/.exec(k), card = el('div', 'card metric');
    const isText = typeof val === 'string' && (val.length > 18 || !/^[\d\.\-\+\/e\s,%]+$/i.test(val));
    const isMultiNum = typeof val === 'string' && val.includes('/') && val.length > 8;
    if (isText) card.classList.add('metric-text');

    const label = m ? m[1] : k;
    card.append(el('div', 'k', label));

    let vd;
    if (isText) {
      vd = el('div', 'v text-val', val);
    } else {
      vd = el('div', 'v' + (isMultiNum ? ' multi-val' : ''), fmt(val));
      if (m && val != null && val !== '') vd.append(el('span', 'u', m[2]));
    }
    card.append(vd); box.append(card);
  });
}
function buildPlots(v) {
  PLOTS.forEach(p => Plotly.purge(p.div)); PLOTS = [];
  const grid = $('plots'), th = theme(); grid.innerHTML = '';
  (v.plots || []).forEach((pl, n) => {
    const card = el('div', 'card plot-card'), div = el('div', 'plot');
    card.append(el('h3', null, pl.title || pl.id || ''), div); grid.append(card);
    const time = !!(C.rocket && (pl.time === true || (pl.time !== false && /^\s*(t|time)\b/i.test(pl.xlabel || ''))));
    const series = pl.series || [];
    const traces = series.map((s, k) => ({ type: 'scatter', mode: s.mode || 'lines', name: s.name || ('series ' + (k + 1)), x: s.x, y: s.y,
      line: { color: th.s[k % 8], width: 2 }, marker: { color: th.s[k % 8], size: 8, line: { color: th.bg, width: 1 } } }));
    const lay = Object.assign(baseLayout(th, 'plot' + C.demo.id + (pl.id || n)), { showlegend: series.length > 1,
      margin: { l: 56, r: 14, t: series.length > 1 ? 30 : 12, b: 42 }, xaxis: axis(th, pl.xlabel), yaxis: axis(th, pl.ylabel) });
    if (time) {
      lay.shapes = [{ type: 'line', xref: 'x', yref: 'paper', x0: C.t[S.i], x1: C.t[S.i], y0: 0, y1: 1, line: { color: th.text2, width: 1.2, dash: 'dot' } }];
      lay.hovermode = 'x unified';
    }
    Plotly.newPlot(div, traces, lay, CFG);
    if (time) div.on('plotly_click', ev => { const pt = ev && ev.points && ev.points[0]; if (pt && typeof pt.x === 'number') seek(pt.x); });
    PLOTS.push({ div, time });
  });
}
function buildTables(v) {
  const box = $('tables'); box.innerHTML = '';
  (v.tables || []).forEach(tb => {
    const card = el('div', 'card table-card'), table = el('table'), thead = el('thead'), tbody = el('tbody'), hr = el('tr');
    card.append(el('h3', 'section-title', tb.title || ''));
    (tb.columns || []).forEach(cn => hr.append(el('th', null, cn))); thead.append(hr);
    (tb.rows || []).forEach(row => {
      const tr = el('tr');
      row.forEach(cell => {
        let cls = typeof cell === 'number' ? 'num' : null;
        if (cell === 'PASS') cls = 'pass';
        else if (cell === 'FAIL') cls = 'fail';
        tr.append(el('td', cls, fmt(cell)));
      });
      tbody.append(tr);
    });
    table.append(thead, tbody); card.append(table); box.append(card);
  });
}
function buildEvents(v) {
  const chips = $('event-chips'), box = $('analysis-events'); chips.innerHTML = ''; box.innerHTML = '';
  const evs = (v.events || []).slice().sort((a, b) => a.t - b.t);
  if (C.rocket) {
    evs.forEach(e => { const ch = el('button', 'chip'); ch.type = 'button'; ch.dataset.t = e.t; ch.title = 'Jump to ' + e.label;
      ch.append(el('b', null, fmt(e.t) + ' s'), e.label); ch.onclick = () => { pause(); seek(e.t); }; chips.append(ch); });
  } else if (evs.length) {
    const card = el('div', 'card text-card'); card.append(el('h3', 'section-title', 'Timeline of Events'));
    evs.forEach(e => card.append(el('div', null, `${fmt(e.t)} s  ${e.label}`))); box.append(card);
  }
  chips.hidden = !evs.length || !C.rocket;
}
function buildNotes(v) {
  const box = $('notes'); box.innerHTML = '';
  if (v.notes) {
    const card = el('div', 'card text-card');
    card.append(el('h3', 'section-title', 'Technical Notes & Analysis'));
    const body = el('div', 'notes-body');
    body.append(paragraphs(v.notes));
    card.append(body);
    box.append(card);
  }
}

// ------------------------------------------------------------------ selection
function buildSidebar() {
  const nav = $('demo-list'), groups = new Map();
  DEMOS.forEach((d, k) => { const g = d.group || 'Other'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(k); });
  groups.forEach((ks, g) => {
    nav.append(el('div', 'group-label', g));
    ks.forEach(k => {
      const d = DEMOS[k], b = el('button', 'demo-btn'); b.type = 'button'; b.dataset.k = k; b.dataset.id = d.id;
      b.append(el('span', null, d.title));
      const analysis = d.variants.every(v => !v.rocket);
      if (analysis || d.variants.length > 1) b.append(el('span', 'tag', analysis ? 'analysis' : d.variants.length + ' variants'));
      b.onclick = () => selectDemo(k); nav.append(b);
    });
  });
  if (!DEMOS.length) $('demo-list').append(el('div', 'empty', 'No demos in results/index.json'));
}
function selectDemo(k) { S.d = k; S.v = 0; render(false); }
function selectVariant(j) { S.v = j; render(true); }
function render(keepTime) {
  if (S.playing) S.playing = false;
  const demo = DEMOS[S.d]; if (!demo) return;
  const v = demo.variants[S.v];
  const prevT = (keepTime && C && C.rocket) ? C.t[S.i] : null;
  C = makeCtx(demo, v);
  document.querySelectorAll('.demo-btn').forEach(b => b.classList.toggle('on', +b.dataset.k === S.d));
  $('demo-group').textContent = demo.group || ''; $('demo-title').textContent = demo.title; document.title = demo.title + ' · GNC Dashboard';
  const desc = $('demo-desc'); desc.innerHTML = ''; desc.append(paragraphs(demo.description));
  const tabs = $('variant-tabs'); tabs.innerHTML = '';
  demo.variants.forEach((vv, j) => { const b = el('button', 'tab' + (j === S.v ? ' on' : ''), vv.label || vv.id); b.type = 'button'; b.dataset.id = vv.id;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', j === S.v); b.onclick = () => selectVariant(j); tabs.append(b); });
  tabs.hidden = demo.variants.length < 2;
  const has = !!C.rocket;
  $('main-view').hidden = !has;
  document.querySelectorAll('#view-toggle button').forEach(b => { b.disabled = !has; b.title = has ? '' : 'No trajectory in this demo (analysis only)'; });
  if (has) {
    S.i = prevT != null ? idxAt(prevT) : 0; S.simT = C.t[S.i];
    $('time-slider').max = C.N - 1;
    S.stale2d = S.stale3d = true;
    S.scale = autoScale();
    setSpeed(SPEEDS.reduce((b, sp) => Math.abs(Math.log(sp * 30 / Math.max(C.t[C.N - 1] - C.t[0], 1))) < Math.abs(Math.log(b * 30 / Math.max(C.t[C.N - 1] - C.t[0], 1))) ? sp : b, 1));  // ~30 s playback
    document.querySelectorAll('#scale-toggle button').forEach(x => x.classList.toggle('on', x.dataset.scale === S.scale));
  } else document.querySelectorAll('#view-toggle button').forEach(b => b.classList.remove('on'));
  buildEvents(v); buildMetrics(v); buildTables(v); buildNotes(v);
  buildPlots(v);
  if (has) setView(S.view);
  pause();
}

function setSpeed(sp) { S.speed = sp; document.querySelectorAll('#speed-seg button').forEach(x => x.classList.toggle('on', +x.dataset.speed === sp)); }

// ------------------------------------------------------------------ wiring
SPEEDS.forEach(sp => { const b = el('button', sp === S.speed ? 'on' : null, sp + '×'); b.type = 'button'; b.dataset.speed = sp;
  b.onclick = () => setSpeed(sp);
  $('speed-seg').append(b); });
document.querySelectorAll('#view-toggle button').forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll('#scale-toggle button').forEach(b => b.onclick = () => { S.scale = b.dataset.scale; S.stale3d = true;
  document.querySelectorAll('#scale-toggle button').forEach(x => x.classList.toggle('on', x === b)); setView('3d'); });
document.querySelector('#scale-toggle button[data-scale="true"]').classList.add('on');
$('play-btn').onclick = togglePlay;
let rsz = null; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (C && C.rocket && S.view === '2d') { S.stale2d = true; setView('2d'); } }, 250); });
$('time-slider').oninput = e => setIdx(+e.target.value);
if ($('theme-btn')) {
  $('theme-btn').onclick = () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.theme;
    try { localStorage.setItem('gnc-theme', S.theme); } catch (e) {}
    $('theme-btn').textContent = S.theme === 'dark' ? 'Light mode' : 'Dark mode';
    render(true);
  };
  $('theme-btn').textContent = S.theme === 'dark' ? 'Light mode' : 'Dark mode';
}
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('select, textarea, input[type=text]')) return;
  if (!C || !C.rocket) return;
  if (e.code === 'Space') { e.preventDefault(); if (e.target.blur) e.target.blur(); togglePlay(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); if (S.playing) pause();
    setIdx(S.i + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 10 : 1));
  }
});
$('build-info').textContent = `Built ${DATA.generated} from ${DATA.source}`;
buildSidebar();
if (DEMOS.length) selectDemo(0);
window.GNC = { S, quatR, bodyAxes: i => bodyAxes(i), selectDemo, selectVariant, setView, play, pause, seek, ctx: () => C };
})();
</script>
</body>
</html>
